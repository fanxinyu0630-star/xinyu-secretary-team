name: 欣雨每日晨报

on:
  schedule:
    # 每天北京时间 8:00 (UTC 0:00) — 晨报
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  morning-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行晨报（新闻 + 出行）
        run: python auto-daily/daily-briefing.py
